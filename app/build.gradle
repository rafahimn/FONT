plugins {
    id 'com.android.application'
}

android {
    namespace 'com.natuu.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.natuu.assistant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
